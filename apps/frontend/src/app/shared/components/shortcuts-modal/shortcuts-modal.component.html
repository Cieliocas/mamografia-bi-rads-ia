<!-- Backdrop -->
<div class="fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm"
     (click)="closed.emit()">

  <!-- Panel -->
  <div class="relative w-full max-w-xl max-h-[80vh] overflow-hidden rounded-2xl border border-white/10 bg-neutral-900 shadow-2xl"
       (click)="$event.stopPropagation()">

    <!-- Header -->
    <div class="flex items-center justify-between border-b border-white/5 px-5 py-4">
      <div class="flex items-center gap-2">
        <lucide-icon [img]="icons.Keyboard" class="h-4 w-4 text-primary"></lucide-icon>
        <h2 class="text-sm font-bold text-on-surface">Atalhos de teclado</h2>
      </div>
      <button (click)="closed.emit()"
        class="rounded p-1 text-on-surface-variant transition hover:text-on-surface hover:bg-white/5">
        <lucide-icon [img]="icons.XIcon" class="h-4 w-4"></lucide-icon>
      </button>
    </div>

    <!-- Scrollable content -->
    <div class="overflow-y-auto max-h-[calc(80vh-4rem)] px-5 py-4 grid grid-cols-2 gap-x-6 gap-y-5">

      @for (group of groups; track group.title) {
        <div class="space-y-1.5">
          <p class="text-[10px] font-bold uppercase tracking-widest text-on-surface-variant/50 pb-1 border-b border-white/5">
            {{ group.title }}
          </p>
          @for (item of group.items; track item.description) {
            <div class="flex items-center justify-between gap-3">
              <!-- Key combo -->
              <div class="flex items-center gap-0.5 shrink-0">
                @for (k of item.keys; track k; let last = $last) {
                  <kbd class="rounded border border-white/20 bg-white/8 px-1.5 py-0.5 text-[10px] font-mono font-semibold text-on-surface leading-tight">
                    {{ k }}
                  </kbd>
                  @if (!last) {
                    <span class="text-[9px] text-on-surface-variant/40 mx-0.5">+</span>
                  }
                }
              </div>
              <!-- Description -->
              <span class="text-[10px] text-on-surface-variant text-right leading-tight">{{ item.description }}</span>
            </div>
          }
        </div>
      }

    </div>

    <!-- Footer hint -->
    <div class="border-t border-white/5 px-5 py-2.5 text-center">
      <p class="text-[9px] text-on-surface-variant/40">
        Pressione <kbd class="rounded border border-white/15 bg-white/5 px-1 py-0.5 text-[9px] font-mono">⌘ ?</kbd> ou <kbd class="rounded border border-white/15 bg-white/5 px-1 py-0.5 text-[9px] font-mono">Esc</kbd> para fechar
      </p>
    </div>
  </div>

</div>
