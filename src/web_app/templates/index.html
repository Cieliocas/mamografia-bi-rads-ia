<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MammoAI - Radiologist Workbench</title>
    <!-- Link to external CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <!-- Load Icons (optional, using text for now) -->
</head>

<body>

    <!-- SIDEBAR PANEL -->
    <div class="sidebar">
        <h2>MammoAI <span style="font-size: 0.8rem; color: #666;">v1.0</span></h2>

        <!-- Upload Section -->
        <div class="control-group">
            <h3>Input</h3>
            <label for="file-upload" class="file-label">
                <span>📂 Open DICOM/Image</span>
            </label>
            <input id="file-upload" type="file" accept="image/*,.dcm" onchange="handleUpload(this)">
        </div>

        <!-- AI Controls (Hidden until upload) -->
        <div id="controls-panel" class="control-group" style="display:none;">
            <h3>Visualization</h3>

            <div class="slider-container">
                <div class="slider-label">
                    <span>Mask Opacity</span>
                    <span id="opacity-val">50%</span>
                </div>
                <input type="range" min="0" max="1" step="0.1" value="0.5" oninput="setOpacity(this.value)">
            </div>

            <button onclick="toggleMask()" class="secondary">👁️ Toggle Mask</button>
            <button onclick="toggleSplitView()" class="secondary">◫ Side-by-Side</button>
            <button onclick="resetView()" class="secondary">⟲ Reset View</button>

            <!-- Analysis Results -->
            <div class="status-panel">
                <h3>AI Diagnosis</h3>
                <div id="ai-result" class="classification-result">Waiting...</div>

                <label style="font-size: 0.9rem; margin-bottom: 5px; display:block;">Radiologist Validation:</label>
                <select id="user-val">
                    <option value="" disabled selected>Select classification...</option>
                    <option value="1">BI-RADS 1: Negative</option>
                    <option value="2">BI-RADS 2: Benign</option>
                    <option value="3">BI-RADS 3: Probably Benign</option>
                    <option value="4">BI-RADS 4: Suspicious</option>
                    <option value="5">BI-RADS 5: Highly Suspicious</option>
                </select>
                <button onclick="submitValidation()">✅ Approve / Save</button>
            </div>
        </div>
    </div>

    <!-- MAIN VIEWER AREA -->
    <div class="main-content">
        <!-- Toolbar (Zoom/Pan Tools) -->
        <div class="toolbar">
            <button class="tool-btn" onclick="zoom(0.1)">➕ Zoom In</button>
            <button class="tool-btn" onclick="zoom(-0.1)">➖ Zoom Out</button>
            <span style="flex-grow: 1;"></span>
            <span id="status-text" style="color: #888; font-size: 0.9rem;">Ready</span>
        </div>

        <!-- Image Canvas -->
        <div class="row-container" id="row-container">
            <div class="canvas-container" id="canvas-container-1">
                <span class="view-label">Overlay View</span>
                <img id="image-layer-1" src="" alt="Mammogram" style="display:none;">
                <img id="mask-layer-1" src="" alt="Segmentation Mask" style="display:none;">
            </div>

            <div class="canvas-container" id="canvas-container-2" style="display:none; border-left: 1px solid #444;">
                <span class="view-label">Original View</span>
                <img id="image-layer-2" src="" alt="Mammogram - Original" style="display:none;">
                <!-- No mask in this view -->
            </div>
        </div>
    </div>

    <!-- Link to external JS -->
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>

</html>
