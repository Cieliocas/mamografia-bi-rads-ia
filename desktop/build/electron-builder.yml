appId: br.ufpi.mammo.desktop
productName: Mammo BI-RADS Desktop
directories:
  output: dist/installers
  buildResources: build/installer
files:
  - apps/ui/.next/**/*
  - apps/ui/electron/**/*
  - apps/ui/package.json
extraResources:
  - from: apps/go-core/bin/go-core
    to: bin/go-core
  - from: apps/ai-engine/dist/ai-engine
    to: bin/ai-engine
  - from: models
    to: models
win:
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  include: build/installer/installer.nsh
linux:
  target:
    - target: deb
      arch:
        - x64
  category: Science
  synopsis: Desktop local mammography BI-RADS workstation
