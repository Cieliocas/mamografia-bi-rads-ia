name: Release

# Triggered when a version tag is pushed, e.g. v1.2.3
on:
  push:
    tags:
      - "v*.*.*"

jobs:
  # ── Build macOS .app via Wails ─────────────────────────────────────────────
  build-macos:
    name: Build macOS desktop app
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v6

      # ── Go ──────────────────────────────────────────────────────────────────
      - uses: actions/setup-go@v6
        with:
          go-version: "1.23"
          cache-dependency-path: apps/desktop/go.sum

      # ── Node (for Angular frontend build) ──────────────────────────────────
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: apps/frontend
        run: npm install --legacy-peer-deps

      # ── Build Angular frontend ──────────────────────────────────────────────
      - name: Build Angular frontend
        working-directory: apps/frontend
        run: npm run build

      # ── Copy built frontend into Wails embed dir ───────────────────────────
      - name: Copy frontend dist to desktop embed dir
        run: cp -r apps/frontend/dist/. apps/desktop/dist/

      # ── Wails CLI ───────────────────────────────────────────────────────────
      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      # ── Build .app (arm64 + amd64 universal) ───────────────────────────────
      - name: Build macOS universal binary
        working-directory: apps/desktop
        run: |
          wails build \
            -platform darwin/universal \
            -clean \
            -s \
            -o AIdentify

      # ── Package as zip ──────────────────────────────────────────────────────
      - name: Zip .app bundle
        run: |
          cd apps/desktop/build/bin
          zip -r "AIdentify-${{ github.ref_name }}-macOS.zip" AIdentify.app

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AIdentify-macOS-${{ github.ref_name }}
          path: apps/desktop/build/bin/AIdentify-${{ github.ref_name }}-macOS.zip
          retention-days: 30

  # ── Build Windows .exe via Wails ──────────────────────────────────────────
  build-windows:
    name: Build Windows desktop app
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: "1.23"
          cache-dependency-path: apps/desktop/go.sum

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: apps/frontend
        run: npm install --legacy-peer-deps

      # ── Build Angular frontend ──────────────────────────────────────────────
      - name: Build Angular frontend
        working-directory: apps/frontend
        run: npm run build

      # ── Copy built frontend into Wails embed dir ───────────────────────────
      - name: Copy frontend dist to desktop embed dir
        run: cp -r apps/frontend/dist/. apps/desktop/dist/

      - name: Install NSIS
        run: choco install nsis -y

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      # Build Windows amd64 installer
      - name: Build Windows installer
        working-directory: apps/desktop
        run: |
          wails build -platform windows/amd64 -clean -s -nsis -o AIdentify

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AIdentify-Windows-${{ github.ref_name }}
          path: apps/desktop/build/bin/AIdentify-amd64-installer.exe
          retention-days: 30

  # ── Create GitHub Release ──────────────────────────────────────────────────
  release:
    name: Create GitHub Release
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: AIdentify-macOS-${{ github.ref_name }}
          path: dist/

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: AIdentify-Windows-${{ github.ref_name }}
          path: dist/

      - name: Extract changelog for this version
        id: changelog
        run: |
          VERSION="${{ github.ref_name }}"
          # Try to extract changelog section between this version and the next heading.
          if [ -f CHANGELOG.md ]; then
            NOTES=$(awk "/^## \[?${VERSION//v/}\]?/,/^## /" CHANGELOG.md \
              | sed '$d' | tail -n +2)
          else
            NOTES="Release ${VERSION}"
          fi
          # Write to file to avoid quoting issues with multiline strings.
          echo "$NOTES" > release_notes.txt

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: "AIdentify ${{ github.ref_name }}"
          body_path: release_notes.txt
          files: |
            dist/AIdentify-${{ github.ref_name }}-macOS.zip
            dist/AIdentify-amd64-installer.exe
