name: CI

on:
  push:
    branches: [main, "claude/**", "feat/**", "fix/**"]
  pull_request:
    branches: [main]

jobs:
  # ── Go Core ───────────────────────────────────────────────────────────────
  go:
    name: Go build & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/core

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: "1.22"
          cache-dependency-path: apps/core/go.sum

      # go-sqlite3 needs cgo + gcc (already present on ubuntu-latest)
      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

  # ── Angular Frontend ──────────────────────────────────────────────────────
  frontend:
    name: Angular type-check, tests & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Type-check
        run: npx tsc --noEmit

      - name: Unit tests (Vitest)
        run: npx ng test --watch=false

      - name: Build
        run: npx ng build --configuration=production

  # ── Python AI Sidecar ─────────────────────────────────────────────────────
  ai-engine:
    name: AI sidecar tests (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ai-engine

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/ai-engine/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Run tests
        env:
          AI_SHARED_TOKEN: ci-test-token
        run: pytest tests/ -v

  # ── Wails desktop shell ───────────────────────────────────────────────────
  desktop:
    name: Desktop shell compile
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: "1.23"
          cache-dependency-path: apps/desktop/go.sum

      # Wails requires webkit2gtk headers for Linux compilation.
      # Ubuntu 24 (Noble) ships 4.1; Ubuntu 22 (Jammy) ships 4.0.
      - name: Install webkit2gtk
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev \
            libwebkit2gtk-4.1-dev 2>/dev/null || \
            sudo apt-get install -y libwebkit2gtk-4.0-dev

      - name: Build (linux/amd64)
        # We compile the Go code only (no wails build) to keep CI fast;
        # actual Wails binary is assembled locally via tools/build_release.sh.
        run: go build ./...
